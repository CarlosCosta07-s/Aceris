[workspace]
resolver = "3"
members = [
    "crates/aceris-common",
    "crates/aceris-core",
    "crates/aceris-graphics",
    "crates/aceris-gl",
    "frontends/desktop",
    "frontends/android",
    "tools/icongen",
]
default-members = [
    "crates/aceris-common",
    "crates/aceris-core",
    "crates/aceris-gl",
    "frontends/desktop",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/CarlosCosta07-s/Aceris"
authors = ["Aceris contributors"]

[workspace.dependencies]
aceris-common = { path = "crates/aceris-common" }
aceris-core = { path = "crates/aceris-core" }
aceris-graphics = { path = "crates/aceris-graphics" }
raw-window-handle = "0.6.2"
aceris-gl = { path = "crates/aceris-gl" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(aceris_typecheck_native)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
# Emulators are unusably slow at opt-level 0.
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
