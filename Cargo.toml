[workspace]
resolver = "3"
members = [
    "crates/aceris-common",
    "crates/aceris-core",
    "frontends/desktop",
    "frontends/android",
]
default-members = [
    "crates/aceris-common",
    "crates/aceris-core",
    "frontends/desktop",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/CarlosCosta07-s/Aceris"
authors = ["Aceris contributors"]

[workspace.dependencies]
aceris-common = { path = "crates/aceris-common" }
aceris-core = { path = "crates/aceris-core" }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
# Emulators are unusably slow at opt-level 0.
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
