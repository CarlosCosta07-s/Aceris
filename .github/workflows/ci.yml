name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo build --locked --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --locked --release -p aceris-core --example benchmark
      - name: Run standalone component profiling
        run: cargo run --release -p aceris-core --example benchmark -- --profile-components
      - uses: actions/upload-artifact@v4
        with:
          name: aceris-pc-benchmark-${{ matrix.os }}
          path: target/release/examples/benchmark*
          if-no-files-found: error

  android:
    name: Android (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - run: cargo ndk -t arm64-v8a build -p aceris-android --release
      - run: cargo ndk -t arm64-v8a build -p aceris-android --bin aceris-benchmark --release
      - uses: actions/upload-artifact@v4
        with:
          name: aceris-android-benchmark-arm64-v8a
          path: target/aarch64-linux-android/release/aceris-benchmark
          if-no-files-found: error
