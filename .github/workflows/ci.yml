name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  lockfile:
    name: Resolve Cargo.lock
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.publish.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate and publish the dependency lockfile
        id: publish
        shell: bash
        run: |
          cargo generate-lockfile
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]] && ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: resolve workspace dependency lockfile"
            git push origin HEAD:main
          fi
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload resolved lockfile for pull-request checks
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lockfile
          path: Cargo.lock
          if-no-files-found: error

  check:
    needs: lockfile
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.lockfile.outputs.ref }}
      - name: Use the generated lockfile for pull requests
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: cargo-lockfile
          path: .lockfile
      - name: Install pull-request lockfile
        if: github.event_name == 'pull_request'
        run: cp .lockfile/Cargo.lock Cargo.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo build --locked --workspace
      - name: Test the native graphics backend without a physical GPU
        run: cargo test --locked -p aceris-graphics
      - name: Lint the graphics backend independently
        run: cargo clippy --locked -p aceris-graphics --all-targets -- -D warnings
      # Run functional tests before workspace Clippy so unrelated existing lints
      # cannot prevent the regression suite from reporting its results.
      - run: cargo test --workspace
      - run: cargo test -p aceris-core --example benchmark
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --locked --release -p aceris-core --example benchmark
      - name: Run standalone component profiling
        run: cargo run --release -p aceris-core --example benchmark -- --profile-components
      - name: Measure translated MMU dispatch (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        env:
          ACERIS_MMU_PROBE_INSTRUCTIONS: 1000000
          ACERIS_MMU_PROBE_ROUNDS: 3
        run: cargo test --release -p aceris-core --lib translated_fast_dispatch_throughput -- --ignored --nocapture
      - name: Run sparse GPU memory access profiling
        run: cargo run --release -p aceris-core --example memory_profile
      - uses: actions/upload-artifact@v4
        with:
          name: aceris-pc-benchmark-${{ matrix.os }}
          path: |
            target/release/examples/benchmark*
            target/release/examples/memory_profile*
          if-no-files-found: error

  android:
    name: Android (arm64-v8a)
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.lockfile.outputs.ref }}
      - name: Use the generated lockfile for pull requests
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: cargo-lockfile
          path: .lockfile
      - name: Install pull-request lockfile
        if: github.event_name == 'pull_request'
        run: cp .lockfile/Cargo.lock Cargo.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - run: cargo ndk -t arm64-v8a build -p aceris-android --release
      - run: cargo ndk -t arm64-v8a build -p aceris-android --bin aceris-benchmark --release
      - run: cargo ndk -t arm64-v8a build -p aceris-core --example memory_profile --release
      - uses: actions/upload-artifact@v4
        with:
          name: aceris-android-benchmark-arm64-v8a
          path: |
            target/aarch64-linux-android/release/aceris-benchmark
            target/aarch64-linux-android/release/examples/memory_profile
          if-no-files-found: error
