name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  android-apk:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7.0.1

      - name: Set up Java for Android build tools
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools

      - name: Install Android platform, build tools and NDK
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Rust toolchain and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build native Rust application
        run: cargo ndk -t arm64-v8a build --locked -p aceris-android --release

      - name: Build isolated NativeActivity smoke-test library
        run: cargo ndk -t arm64-v8a build --locked -p aceris-android-smoke --release

      - name: Save full Aceris library before building probes
        run: install -m 0644 target/aarch64-linux-android/release/libaceris_android.so build-full-main.so

      - name: Build worker-only startup probe library
        run: |
          cargo ndk -t arm64-v8a build --locked -p aceris-android --release --features startup-probe-no-app
          install -m 0644 target/aarch64-linux-android/release/libaceris_android.so build-thread-probe.so

      - name: Build App and CPU-frame startup probe library
        run: |
          cargo ndk -t arm64-v8a build --locked -p aceris-android --release --features startup-probe-app-frame
          install -m 0644 target/aarch64-linux-android/release/libaceris_android.so build-app-frame-probe.so

      - name: Package and sign development APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p build/native/lib/arm64-v8a

          "$BUILD_TOOLS/aapt2" compile \
            --dir frontends/android/res \
            -o build/aceris-resources.zip

          "$BUILD_TOOLS/aapt2" link \
            -I "$ANDROID_HOME/platforms/android-35/android.jar" \
            --manifest frontends/android/AndroidManifest.xml \
            --min-sdk-version 24 \
            --target-sdk-version 34 \
            --version-code 1 \
            --version-name "0.0.1-dev" \
            -o build/aceris-unsigned.apk \
            build/aceris-resources.zip

          install -m 0644 \
            build-full-main.so \
            build/native/lib/arm64-v8a/libaceris_android.so

          (
            cd build/native
            zip -q -0 ../aceris-unsigned.apk lib/arm64-v8a/libaceris_android.so
          )

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            build/aceris-unsigned.apk build/aceris-aligned.apk

          keytool -genkeypair -noprompt \
            -keystore build/aceris-ci-debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          "$BUILD_TOOLS/apksigner" sign \
            --ks build/aceris-ci-debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/aceris-debug.apk \
            build/aceris-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose build/aceris-debug.apk
          "$BUILD_TOOLS/aapt" dump badging build/aceris-debug.apk | \
            grep -F "package: name='org.aceris.emulator'"
          unzip -l build/aceris-debug.apk | grep -F "lib/arm64-v8a/libaceris_android.so"
          sha256sum build/aceris-debug.apk

      - name: Upload installable development APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: aceris-android-arm64-debug
          path: build/aceris-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package full Aceris startup test APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p build/fulltest-res build/fulltest-native/lib/arm64-v8a

          cp -R frontends/android/res/. build/fulltest-res/
          sed -i 's#<string name="app_name">Aceris</string>#<string name="app_name">Aceris Full Startup Test</string>#' build/fulltest-res/values/strings.xml
          "$BUILD_TOOLS/aapt2" compile \
            --dir build/fulltest-res \
            -o build/aceris-fulltest-resources.zip

          sed 's#package="org.aceris.emulator"#package="org.aceris.emulator.fulltest"#' \
            frontends/android/AndroidManifest.xml > build/AndroidManifest-fulltest.xml

          "$BUILD_TOOLS/aapt2" link \
            -I "$ANDROID_HOME/platforms/android-35/android.jar" \
            --manifest build/AndroidManifest-fulltest.xml \
            --min-sdk-version 24 \
            --target-sdk-version 34 \
            --version-code 1 \
            --version-name "0.0.1-fulltest" \
            -o build/aceris-fulltest-unsigned.apk \
            build/aceris-fulltest-resources.zip

          install -m 0644 \
            build-full-main.so \
            build/fulltest-native/lib/arm64-v8a/libaceris_android.so

          (
            cd build/fulltest-native
            zip -q -0 ../aceris-fulltest-unsigned.apk lib/arm64-v8a/libaceris_android.so
          )

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            build/aceris-fulltest-unsigned.apk build/aceris-fulltest-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks build/aceris-ci-debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/aceris-full-startup-test.apk \
            build/aceris-fulltest-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose build/aceris-full-startup-test.apk
          "$BUILD_TOOLS/aapt" dump badging build/aceris-full-startup-test.apk | \
            grep -F "package: name='org.aceris.emulator.fulltest'"
          unzip -l build/aceris-full-startup-test.apk | grep -F "lib/arm64-v8a/libaceris_android.so"
          sha256sum build/aceris-full-startup-test.apk

      - name: Upload full Aceris startup test APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: aceris-android-full-startup-test-arm64
          path: build/aceris-full-startup-test.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package staged startup probe APKs
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          package_probe() {
            local suffix="$1"
            local package_id="$2"
            local label="$3"
            local library="$4"
            local version="$5"
            local root="build/probe-$suffix"
            local resources="$root/resources"
            local native="$root/native/lib/arm64-v8a"
            mkdir -p "$resources" "$native"
            cp -R frontends/android/res/. "$resources/"
            sed -i "s#<string name=\"app_name\">Aceris</string>#<string name=\"app_name\">$label</string>#" \
              "$resources/values/strings.xml"
            "$BUILD_TOOLS/aapt2" compile --dir "$resources" -o "$root/resources.zip"
            sed "s#package=\"org.aceris.emulator\"#package=\"$package_id\"#" \
              frontends/android/AndroidManifest.xml > "$root/AndroidManifest.xml"
            "$BUILD_TOOLS/aapt2" link \
              -I "$ANDROID_HOME/platforms/android-35/android.jar" \
              --manifest "$root/AndroidManifest.xml" \
              --min-sdk-version 24 --target-sdk-version 34 \
              --version-code 1 --version-name "$version" \
              -o "$root/unsigned.apk" "$root/resources.zip"
            install -m 0644 "$library" "$native/libaceris_android.so"
            (cd "$root/native" && zip -q -0 "../unsigned.apk" lib/arm64-v8a/libaceris_android.so)
            "$BUILD_TOOLS/zipalign" -f -p 4 "$root/unsigned.apk" "$root/aligned.apk"
            "$BUILD_TOOLS/apksigner" sign \
              --ks build/aceris-ci-debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android \
              --out "$root/$suffix.apk" "$root/aligned.apk"
            "$BUILD_TOOLS/apksigner" verify --verbose "$root/$suffix.apk"
            "$BUILD_TOOLS/aapt" dump badging "$root/$suffix.apk" | grep -F "package: name='$package_id'"
            unzip -l "$root/$suffix.apk" | grep -F "lib/arm64-v8a/libaceris_android.so"
            sha256sum "$root/$suffix.apk"
          }

          package_probe thread \
            org.aceris.emulator.threadprobe \
            "Aceris Thread Test" \
            build-thread-probe.so \
            "0.0.1-thread-probe"

          package_probe appframe \
            org.aceris.emulator.appframeprobe \
            "Aceris App Frame Test" \
            build-app-frame-probe.so \
            "0.0.1-app-frame-probe"

      - name: Upload worker-only startup probe APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: aceris-android-thread-probe-arm64
          path: build/probe-thread/thread.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload App and CPU-frame startup probe APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: aceris-android-app-frame-probe-arm64
          path: build/probe-appframe/appframe.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package isolated NativeActivity smoke-test APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p build/smoke-res build/smoke-native/lib/arm64-v8a

          cp -R frontends/android/res/. build/smoke-res/
          sed -i 's#<string name="app_name">Aceris</string>#<string name="app_name">Aceris Startup Test</string>#' build/smoke-res/values/strings.xml
          "$BUILD_TOOLS/aapt2" compile \
            --dir build/smoke-res \
            -o build/aceris-smoke-resources.zip

          sed 's#package="org.aceris.emulator"#package="org.aceris.emulator.smoke"#' \
            frontends/android/AndroidManifest.xml > build/AndroidManifest-smoke.xml

          "$BUILD_TOOLS/aapt2" link \
            -I "$ANDROID_HOME/platforms/android-35/android.jar" \
            --manifest build/AndroidManifest-smoke.xml \
            --min-sdk-version 24 \
            --target-sdk-version 34 \
            --version-code 1 \
            --version-name "0.0.1-smoke" \
            -o build/aceris-smoke-unsigned.apk \
            build/aceris-smoke-resources.zip

          install -m 0644 \
            target/aarch64-linux-android/release/libaceris_android_smoke.so \
            build/smoke-native/lib/arm64-v8a/libaceris_android.so

          (
            cd build/smoke-native
            zip -q -0 ../aceris-smoke-unsigned.apk lib/arm64-v8a/libaceris_android.so
          )

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            build/aceris-smoke-unsigned.apk build/aceris-smoke-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks build/aceris-ci-debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/aceris-startup-smoke.apk \
            build/aceris-smoke-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose build/aceris-startup-smoke.apk
          "$BUILD_TOOLS/aapt" dump badging build/aceris-startup-smoke.apk | \
            grep -F "package: name='org.aceris.emulator.smoke'"
          unzip -l build/aceris-startup-smoke.apk | grep -F "lib/arm64-v8a/libaceris_android.so"
          sha256sum build/aceris-startup-smoke.apk

      - name: Upload isolated NativeActivity smoke-test APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: aceris-android-startup-smoke-arm64
          path: build/aceris-startup-smoke.apk
          if-no-files-found: error
          retention-days: 14
